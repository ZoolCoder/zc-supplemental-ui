# Builds the preview site against the bundle in build/. Run `npm run preview`.
antora:
  extensions:
    - require: '@antora/lunr-extension'
      languages: [en, ar]
    - ./../extensions/last-updated.js
    - ./../extensions/llms.js
    - ./../extensions/og-image.js
site:
  title: zc-supplemental-ui
  url: http://127.0.0.1:8642
  start_page: preview::index.adoc
content:
  sources:
    - url: ./..
      start_paths: [preview, preview-ar, preview-old]
      branches: HEAD
      edit_url: false
ui:
  bundle:
    url: ./../build/ui-bundle.zip
urls:
  latest_version_segment: ''
asciidoc:
  extensions:
    - '@asciidoctor/tabs'
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    source-highlighter: highlight.js
    page-zc-repo: https://github.com/zoolcoder/zc-supplemental-ui
    page-zc-site: https://zoolcoder.com/
    page-zc-site-name: zoolcoder.com
    page-zc-owner: ZoolCoder
    page-zc-pdf: preview/_exports/index.pdf@
    page-zc-langs: en=preview ar=preview-ar
output:
  dir: ./../build/preview
