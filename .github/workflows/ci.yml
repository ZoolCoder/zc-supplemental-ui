name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: npm ci
      # The Arabic PDF prints through the Chrome preinstalled on the runner.
      - name: build the preview site and its PDFs
        run: npm run preview:pdf
      - name: the PDFs, llms.txt and link-preview cards exist
        run: |
          test -s build/preview/preview/_exports/index.pdf
          test -s build/preview/preview-ar/_exports/index.pdf
          grep -q '^## ' build/preview/llms.txt
          test -s build/preview/preview/blocks.md
          test -s build/preview/_og/preview-ar/index.png
