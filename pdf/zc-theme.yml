# ZoolCoder theme for asciidoctor-pdf, the PDF side of zc-supplemental-ui.
# It keeps the bundled Noto Sans fonts of default-sans and carries over the
# toolshell palette: ink #111318, muted #5B6170, accent #2563EB.
# Use with: -a pdf-themesdir=<dir> -a pdf-theme=zc
extends: default-sans
base:
  font-color: '111318'
  text-align: left
  font-size: 10.5
  line-height-length: 15
  border-color: 'E3E6ED'
role:
  muted:
    font-color: '5B6170'
page:
  size: A4
  margin: [0.8in, 0.75in, 0.85in, 0.75in]
link:
  font-color: '2563EB'
heading:
  font-color: '111318'
  font-style: bold
  h1-font-size: 26
  h2-font-size: 20
  h3-font-size: 15
  h4-font-size: 12.5
  margin-top: 14
  margin-bottom: 8
  chapter:
    break-before: always
title-page:
  align: left
  logo:
    image: image:mark.svg[pdfwidth=0.9in]
    align: left
    top: 18%
  title:
    top: 34%
    font-size: 34
    font-style: bold
    font-color: '111318'
    line-height: 1.1
  subtitle:
    font-size: 15
    font-style: normal
    font-color: '5B6170'
  authors:
    font-color: '5B6170'
    margin-top: 24
  revision:
    font-color: '8A90A0'
codespan:
  font-color: '1D2433'
  background-color: 'F1F3F8'
  border-radius: 2
code:
  font-color: '1D2433'
  font-size: 8.8
  background-color: 'F6F8FB'
  border-color: 'E3E6ED'
  border-radius: 6
  border-width: 0.75
  padding: [9, 11]
  line-height: 1.4
kbd:
  background-color: 'FFFFFF'
  border-color: 'C9CED9'
  border-offset: 2
admonition:
  column-rule-color: '2563EB'
  column-rule-width: 2
  padding: [4, 12, 4, 12]
  label:
    font-style: bold
    font-color: '2563EB'
    text-transform: uppercase
  icon:
    note:
      stroke-color: '2563EB'
    tip:
      stroke-color: '16A34A'
    important:
      stroke-color: '7C3AED'
    warning:
      stroke-color: 'D97706'
    caution:
      stroke-color: 'DC2626'
sidebar:
  background-color: 'F6F8FB'
  border-color: 'E3E6ED'
  border-radius: 6
  title:
    font-color: '111318'
    text-align: left
example:
  border-color: 'E3E6ED'
  border-radius: 6
quote:
  font-color: '5B6170'
  border-left-color: 'BFD0FB'
  border-left-width: 3
table:
  border-color: 'E3E6ED'
  grid-color: 'E3E6ED'
  border-width: 0.5
  grid-width: 0.5
  head:
    background-color: 'F1F3F8'
    font-color: '5B6170'
    font-style: bold
    font-size: 8.5
    text-transform: uppercase
  cell:
    padding: [5, 7, 5, 7]
toc:
  font-color: '111318'
  dot-leader:
    font-color: 'B8BDC9'
  h2-font-style: bold
callout-list:
  margin-top-after-code: 4
conum:
  font-color: '2563EB'
header:
  height: 0.55in
  font-size: 8.5
  font-color: '8A90A0'
  border-color: 'E3E6ED'
  border-width: 0.5
  vertical-align: middle
  recto:
    left:
      content: '{document-title}'
    right:
      content: '{section-or-chapter-title}'
  verso:
    left:
      content: $header-recto-right-content
    right:
      content: $header-recto-left-content
footer:
  height: 0.55in
  font-size: 8.5
  font-color: '8A90A0'
  border-color: 'E3E6ED'
  border-width: 0.5
  vertical-align: middle
  recto:
    left:
      content: 'image:mark.svg[width=10] {zc-owner}'
    right:
      content: '{page-number} / {page-count}'
  verso:
    left:
      content: $footer-recto-right-content
    right:
      content: $footer-recto-left-content
