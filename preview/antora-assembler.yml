# One PDF per component version: asciidoctor-pdf with the theme in pdf/, or
# Chrome for the Arabic one. See bin/zc-pdf.js.
root_level: 0
build:
  command: node ../bin/zc-pdf.js -a pdf-themesdir=../pdf -a pdf-theme=zc
  publish: true
asciidoc:
  attributes:
    doctype: book
    toc: ''
    toclevels: 2
    source-highlighter: rouge
    title-page: ''
    zc-owner: ZoolCoder
